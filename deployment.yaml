apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-api
  template:
    metadata:
      labels:
        app: dotnet-api
    spec:
      serviceAccountName: dotnet-api-sa
      containers:
        - name: dotnet-api
          image: 712685518638.dkr.ecr.ap-southeast-2.amazonaws.com/dotnet-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: S3__BucketName
              value: "eks-jenkins-dotnet-files-712685518638-20261119"
            - name: S3__KeyPrefix
              value: "training-uploads"
            - name: ConnectionStrings__Rds
              valueFrom:
                secretKeyRef:
                  name: dotnet-api-db
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /swagger/index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /swagger/index.html
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
